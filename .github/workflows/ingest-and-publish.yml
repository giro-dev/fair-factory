name: Ingesta i publicació a GitHub Pages

on:
  schedule:
    - cron: "30 4 * * 1"   # dilluns 04:30 UTC
  workflow_dispatch:
    inputs:
      pcsp_pages:
        description: "Pàgines del feed ATOM de la PCSP"
        default: "3"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install .
      - name: Ingesta
        run: |
          fair-factory ingest --keep-going --pcsp-pages "${{ github.event.inputs.pcsp_pages || 3 }}"
          fair-factory stats
          fair-factory export-summary --out site/summary.json
          cp data/transparencia.sqlite site/transparencia.sqlite
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: ingest
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
