name: Ingesta i persistència de la sqlite al repositori

on:
  schedule:
    - cron: "30 4 * * 1"   # dilluns 04:30 UTC
  workflow_dispatch:
    inputs:
      pcsp_pages:
        description: "Pàgines màximes del feed ATOM de la PCSP (sostre; el checkpoint atura abans)"
        default: "20"

permissions:
  contents: write   # la pipeline commiteja docs/transparencia.sqlite.gz i docs/summary.json

concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  # Un job per grup d'administració: els timeouts d'una font no alenteixen
  # les altres, i cada job produeix una sqlite parcial com a artefacte.
  ingest:
    strategy:
      fail-fast: false
      matrix:
        include:
          - grup: asturias
            fonts: >-
              bdns siero_transparencia asturias_transparencia
              siero_sede siero_cifras
            extra_args: "--bdns-admin siero,asturias"
          - grup: catalunya
            fonts: >-
              bdns aoc_contractes figueres_ckan figueres_contractes
              diputacio_girona catalunya_socrata
              gencat_historial_alcaldes gencat_carrecs_electes
            extra_args: "--bdns-admin figueres,girona,diputacio_girona,catalunya"
          - grup: compartit
            fonts: "datos_gob pcsp partits_curats"
            extra_args: ""
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install .
      - name: Ingesta (${{ matrix.grup }})
        run: |
          # --db és opció global: ha d'anar abans del subcomandament
          fair-factory --db "data/part-${{ matrix.grup }}.sqlite" \
            ingest --keep-going \
            --pcsp-pages "${{ github.event.inputs.pcsp_pages || 3 }}" \
            ${{ matrix.extra_args }} ${{ matrix.fonts }}
          fair-factory --db "data/part-${{ matrix.grup }}.sqlite" stats
      # senyal visible si alguna font del job ha fallat (--keep-going sempre
      # retorna 0); l'artefacte es puja igualment amb les fonts bones
      - name: Diagnòstic connectivitat Astúries
        if: matrix.grup == 'asturias' && always()
        run: |
          echo "=== DNS ==="
          getent ahosts transparencia.asturias.es || true
          echo "=== IPv4 ==="
          curl -4 -sS -o /dev/null --connect-timeout 10 -w "%{http_code}" \
            https://transparencia.asturias.es/ || echo "timeout IPv4"
          echo "=== IPv6 ==="
          curl -6 -sS -o /dev/null --connect-timeout 10 -w "%{http_code}" \
            https://transparencia.asturias.es/ || echo "sense IPv6"
      - name: Fonts en error
        if: always()
        run: |
          errors=$(sqlite3 "data/part-${{ matrix.grup }}.sqlite" \
            "SELECT COUNT(*) FROM ingest_run WHERE estat='error'" 2>/dev/null || echo 1)
          if [ "$errors" -gt 0 ]; then
            sqlite3 "data/part-${{ matrix.grup }}.sqlite" \
              "SELECT font, missatge FROM ingest_run WHERE estat='error'"
            echo "::warning::${{ matrix.grup }}: $errors fonts han fallat"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sqlite-${{ matrix.grup }}
          path: data/part-${{ matrix.grup }}.sqlite
          if-no-files-found: warn
          retention-days: 3

  publish:
    needs: ingest
    if: always()   # publica encara que algun job de la matriu hagi fallat
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install .
      - uses: actions/download-artifact@v4
        with:
          pattern: sqlite-*
          path: parts
      - name: Fusió de les BDs parcials sobre la publicada anterior
        run: |
          shopt -s nullglob
          parts=(parts/*/part-*.sqlite)
          # la darrera BD publicada com a base: si un job ha fallat (p. ex.
          # bloqueig d'IP del portal), els seus registres antics es conserven
          gunzip -c docs/transparencia.sqlite.gz > data/transparencia.sqlite
          if [ ${#parts[@]} -gt 0 ]; then
            fair-factory merge --keep --out data/transparencia.sqlite "${parts[@]}"
          fi
          fair-factory --db data/transparencia.sqlite stats
          fair-factory --db data/transparencia.sqlite export-summary --out docs/summary.json
          # artefacte publicat «slim»: raw de subvencio buidat (duplica les
          # columnes) per mantenir la BD sota els límits de GitHub i de la web
          fair-factory --db data/transparencia.sqlite slim
          gzip -9c data/transparencia.sqlite > docs/transparencia.sqlite.gz
      - name: Persisteix la sqlite al repositori
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/transparencia.sqlite.gz docs/summary.json
          if git diff --cached --quiet; then
            echo "Cap canvi en les dades; res a commitejar."
          else
            git commit -m "chore: ingesta $(date -u +%Y-%m-%d) [skip ci]"
            git push
          fi
