name: Ingesta i persistència de la sqlite al repositori

on:
  schedule:
    - cron: "30 4 * * 1"   # dilluns 04:30 UTC
  workflow_dispatch:
    inputs:
      pcsp_pages:
        description: "Pàgines del feed ATOM de la PCSP"
        default: "3"

permissions:
  contents: write   # la pipeline commiteja docs/transparencia.sqlite i docs/summary.json

concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install .
      - name: Ingesta
        run: |
          fair-factory ingest --keep-going --pcsp-pages "${{ github.event.inputs.pcsp_pages || 3 }}"
          fair-factory stats
          fair-factory export-summary --out docs/summary.json
          # GitHub rebutja fitxers >100 MB: la sqlite es publica comprimida
          gzip -9c data/transparencia.sqlite > docs/transparencia.sqlite.gz
      - name: Persisteix la sqlite al repositori
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/transparencia.sqlite.gz docs/summary.json
          if git diff --cached --quiet; then
            echo "Cap canvi en les dades; res a commitejar."
          else
            git commit -m "chore: ingesta $(date -u +%Y-%m-%d) [skip ci]"
            git push
          fi
