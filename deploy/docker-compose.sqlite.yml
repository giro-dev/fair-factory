services:
  app:
    pull_policy: build
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    env_file: .env
    environment:
      SPRING_PROFILES_ACTIVE: sqlite
      FANEL_SQLITE_PATH: /data/fanel.db
      # Scheduled JSON backups land inside the fanel-data volume:
      # FANEL_BACKUPS_DIR: /data/backups
      # Prometheus metrics endpoint (authenticated):
      # FANEL_METRICS_ACCESS: read-only
    ports:
      - "8080:8080"
    volumes:
      - fanel-data:/data
volumes:
  fanel-data:
