spring:
  application:
    name: fanel
  autoconfigure:
    # The library's web layer (extra handler mappings, non-RFC-9457 error advice) does not
    # fit this API; recipes.infra.CriteriaFilterConfiguration wires the needed beans instead.
    exclude: dev.agiro.criteriafilter.autoconfigure.CriteriaFilterAutoConfiguration
  profiles:
    default: postgres
  servlet:
    multipart:
      max-file-size: ${FANEL_MAX_UPLOAD_SIZE:50MB}
      max-request-size: ${FANEL_MAX_UPLOAD_SIZE:50MB}
  mvc:
    problemdetails:
      enabled: true
  flyway:
    locations: classpath:db/migration/common,classpath:db/migration/{vendor}
  jpa:
    open-in-view: false
  ai:
    mcp:
      server:
        enabled: false
    ollama:
      base-url: ${SPRING_AI_OLLAMA_BASE_URL:http://localhost:11434}
      init:
        pull-model-strategy: never
    openai:
      api-key: ${SPRING_AI_OPENAI_API_KEY:}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
    prometheus:
      access: ${FANEL_METRICS_ACCESS:none}
fanel:
  admin:
    user: ${FANEL_ADMIN_USER:admin}
    password: ${FANEL_ADMIN_PASSWORD:admin}
  cors:
    origins: ${FANEL_CORS_ORIGINS:http://localhost:5173}
  api:
    token: ${FANEL_API_TOKEN:}
  vapid:
    subject: ${FANEL_VAPID_SUBJECT:mailto:admin@example.com}
    public-key: ${FANEL_VAPID_PUBLIC_KEY:}
    private-key: ${FANEL_VAPID_PRIVATE_KEY:}
  oidc:
    issuer: ${FANEL_OIDC_ISSUER:}
    client-id: ${FANEL_OIDC_CLIENT_ID:}
    client-secret: ${FANEL_OIDC_CLIENT_SECRET:}
    name: ${FANEL_OIDC_NAME:SSO}
    username-claim: ${FANEL_OIDC_USERNAME_CLAIM:preferred_username}
    scopes: ${FANEL_OIDC_SCOPES:openid,profile,email}
  backups:
    dir: ${FANEL_BACKUPS_DIR:}
    hour: ${FANEL_BACKUPS_HOUR:3}
    keep-days: ${FANEL_BACKUPS_KEEP_DAYS:30}
  notifications:
    reminder-hour: ${FANEL_NOTIFICATIONS_REMINDER_HOUR:8}
  calendar:
    ics-refresh-minutes: ${FANEL_CALENDAR_ICS_REFRESH_MINUTES:60}
  assistant:
    orchestrator-id: orchestrator
    agents:
      orchestrator:
        name-key: assistant.orchestrator.name
        description-key: assistant.orchestrator.description
        prompt-key: orchestrator
        supports-media: false
        tools:
          - AssistantTools
          - Subagents
        model:
          provider: openai
          model: gpt-4o
          temperature: 0.3
      recipe-from-image:
        name-key: assistant.recipe-from-image.name
        description-key: assistant.recipe-from-image.description
        prompt-key: recipe-from-image
        supports-media: true
        tool-description: "Extract a structured recipe proposal (JSON) from an attached photo of a dish or recipe card. Use whenever the user attached an image related to food/recipes."
        tools:
          - AssistantTools
        model:
          provider: openai
          model: gpt-4o-mini
          temperature: 0.2
      recipe-extractor:
        name-key: assistant.recipe-extractor.name
        description-key: assistant.recipe-extractor.description
        prompt-key: recipe-extractor
        supports-media: false
        tool-description: "Structure raw recipe text into a recipe JSON object. Used internally by the recipe book import; not meant for user-facing delegation."
        tools: []
        model:
          provider: openai
          model: gpt-4o-mini
          temperature: 0.2
      menu-planner:
        name-key: assistant.menu-planner.name
        description-key: assistant.menu-planner.description
        prompt-key: menu-planner
        supports-media: false
        tool-description: "Plan the household weekly menu: fills empty lunch/dinner slots of a given ISO week with household recipes. Pass the full task in natural language, including the week if the user mentioned one."
        tools:
          - AssistantTools
        model:
          provider: openai
          model: gpt-4o-mini
          temperature: 0.5